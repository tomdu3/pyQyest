[project]
name = "PyQuest"
version = "0.1.0"
description = "A simple Python learning quiz app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.6.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "jinja2>=3.1.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

