<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyQuest - Admin Quiz Generator</title>
    <!-- Use vanilla CSS or simple framework like Tailwind via CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen p-8">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-bold text-indigo-600">PyQuest Admin 🪄</h1>
            <p class="text-slate-500">Gemini-Powered Quiz Question Generator</p>
        </header>

        {% if error %}
        <div class="bg-red-50 text-red-700 p-4 rounded-lg border border-red-200 shadow-sm transition-all duration-300">
            <strong>Error:</strong> {{ error }}
        </div>
        {% endif %}
        
        {% if success_message %}
        <div class="bg-green-50 text-green-700 p-4 rounded-lg border border-green-200 shadow-sm transition-all duration-300">
            <strong>Success:</strong> {{ success_message }}
        </div>
        {% endif %}

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Generate Form -->
            <div class="glass p-6 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-semibold mb-4 text-slate-800">Generate New Question</h2>
                <form action="/admin/generator/suggest" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Target Lesson</label>
                        <select name="lesson_id" class="w-full border-slate-300 rounded-lg p-3 bg-white shadow-sm focus:ring-2 focus:ring-indigo-500" required>
                            {% for lesson in lessons %}
                                <option value="{{ lesson.id }}" {% if target_lesson_id == lesson.id %}selected{% endif %}>Lesson {{ lesson.id }}: {{ lesson.title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Topic (e.g. "String slicing")</label>
                        <input type="text" name="topic" class="w-full border-slate-300 rounded-lg p-3 shadow-sm focus:ring-2 focus:ring-indigo-500" placeholder="What should the question be about?" required>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                        <span>Generate with Gemini</span>
                        <span>✨</span>
                    </button>
                </form>
            </div>

            <!-- Preview / Editor Form -->
            <div class="glass p-6 rounded-2xl shadow-xl {% if not suggestion %}opacity-50 pointer-events-none{% endif %}">
                <h2 class="text-2xl font-semibold mb-4 text-slate-800">Preview & Edit</h2>
                
                <form action="/admin/generator/save" method="POST" class="space-y-4">
                    
                    <input type="hidden" name="lesson_id" value="{{ target_lesson_id or (lessons[0].id if lessons else 1) }}">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Question ID</label>
                        <input type="text" name="question_id" value="{{ suggestion.id if suggestion else '' }}" class="w-full bg-slate-50 border-slate-300 rounded p-2 text-sm font-mono" required>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Question</label>
                        <textarea name="question" class="w-full border-slate-300 rounded p-2 text-sm" rows="2" required>{{ suggestion.question if suggestion else '' }}</textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Code Snippet (Optional)</label>
                        <textarea name="codeSnippet" class="w-full border-slate-300 rounded p-2 text-sm font-mono" rows="2">{{ suggestion.codeSnippet if suggestion else '' }}</textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Option 1</label>
                            <input type="text" name="opt1" value="{{ suggestion.options[0] if suggestion and suggestion.options|length > 0 else '' }}" class="w-full border-slate-300 rounded p-2 text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Option 2</label>
                            <input type="text" name="opt2" value="{{ suggestion.options[1] if suggestion and suggestion.options|length > 1 else '' }}" class="w-full border-slate-300 rounded p-2 text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Option 3</label>
                            <input type="text" name="opt3" value="{{ suggestion.options[2] if suggestion and suggestion.options|length > 2 else '' }}" class="w-full border-slate-300 rounded p-2 text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Option 4</label>
                            <input type="text" name="opt4" value="{{ suggestion.options[3] if suggestion and suggestion.options|length > 3 else '' }}" class="w-full border-slate-300 rounded p-2 text-sm" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Correct Answer <span class="text-red-500">(MUST exactly match one option)</span></label>
                        <input type="text" name="correctAnswer" value="{{ suggestion.correctAnswer if suggestion else '' }}" class="w-full border-indigo-300 ring-1 ring-indigo-500 rounded p-2 text-sm bg-indigo-50 font-medium" required>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Explanation</label>
                        <textarea name="explanation" class="w-full border-slate-300 rounded p-2 text-sm" rows="2" required>{{ suggestion.explanation if suggestion else '' }}</textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">YouTube Link (Optional)</label>
                        <input type="text" name="youtubeLink" value="{{ suggestion.youtubeLink if suggestion else '' }}" class="w-full border-slate-300 rounded p-2 text-sm text-blue-600">
                    </div>

                    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all transform hover:scale-[1.02]">
                        💾 Save to JSON Bank
                    </button>
                    
                </form>
            </div>
            
        </div>

    </div>
</body>
</html>
